{% extends "layout.html" %}

{% block content %}

<section class="pagehead">
  <div class="shell pagehead__inner">
    <nav class="crumbs">
      <a href="/">{{ __("Home") }}</a>
      <i class="fa-solid fa-chevron-right" style="font-size:9px"></i>
      <span>{{ page.title }}</span>
    </nav>
    <h1 class="pagehead__title"><span class="g-w">{{ page.title }}</span></h1>
  </div>
</section>

<div class="shell" style="padding-top:32px">
  <div class="card">
    <div class="prose">{{ page.metaData.content|raw }}</div>
  </div>
</div>

{% endblock %}
